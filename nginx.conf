# ============================================================
# nginx for secrets.1ms.my
#
# One thing about headers matters here: an add_header inside a
# location REPLACES every add_header inherited from the server
# level rather than adding to it. So the caching policy is driven
# by a single map keyed on content type instead of a per-location
# add_header — that way the security headers reliably reach every
# response, css and js included.
# ============================================================

# Matching is done with regexes rather than exact keys: the charset
# directive appends "; charset=utf-8" to the content type, after
# which an exact key of text/html would never match again.
map $sent_http_content_type $pwd_cache_control {
    # HTML — short cache with mandatory revalidation, so edits to
    # index.html are picked up on the next visit.
    ~^text/html                        "public, max-age=300, must-revalidate";

    # CSS and JS are rewritten in place on every build while the file
    # name stays the same, so immutable is not an option.
    ~^text/css                         "public, max-age=3600, must-revalidate";
    ~^(application|text)/javascript    "public, max-age=3600, must-revalidate";

    # For a given name, images and fonts effectively never change.
    ~^image/                           "public, max-age=604800";
    ~^font/                            "public, max-age=604800";

    default                            "public, max-age=300, must-revalidate";
}

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    charset_types text/css application/javascript text/javascript application/json;

    # Do not advertise the nginx version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    # ---------- Headers ----------
    #
    # The key line is connect-src 'none'. The page makes no network call
    # at all, and this header turns that claim into a prohibition the
    # browser enforces: even with an injected script, exfiltrating a typed
    # password over fetch would not work.
    #
    # 'unsafe-inline' appears nowhere: the markup contains no inline
    # script, no inline style and no attribute event handler.
    #
    # The only external origins left are Google Fonts — the stylesheet from
    # fonts.googleapis.com and the files from fonts.gstatic.com. Once the
    # fonts move into the repo, both entries go and the policy becomes
    # entirely 'self'.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; manifest-src 'self'" always;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;

    # TLS is terminated at Cloudflare, but a header set at the origin
    # passes through. No includeSubDomains: this covers pwd only.
    add_header Strict-Transport-Security "max-age=31536000" always;

    add_header Cache-Control $pwd_cache_control always;

    # ---------- Routes ----------

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
