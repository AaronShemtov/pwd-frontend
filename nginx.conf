# ============================================================
# nginx для pwd.1ms.my
#
# Про заголовки важно знать одну вещь: add_header в location
# ЗАМЕЩАЕТ все add_header, унаследованные с уровня server, а не
# дополняет их. Поэтому политика кеширования задана не через
# add_header в каждом location, а одной map по типу содержимого —
# так все заголовки безопасности гарантированно доезжают до
# любого ответа, включая css и js.
# ============================================================

# Сравнение идёт регулярками, а не точным совпадением: директива
# charset дописывает к типу "; charset=utf-8", и точный ключ
# text/html после этого не совпал бы никогда.
map $sent_http_content_type $pwd_cache_control {
    # HTML — короткий кеш с обязательной перепроверкой: правки
    # в index.html должны подхватываться при следующем заходе.
    ~^text/html                        "public, max-age=300, must-revalidate";

    # CSS и JS переписываются на месте при каждой сборке, имя файла
    # при этом не меняется — значит immutable ставить нельзя.
    ~^text/css                         "public, max-age=3600, must-revalidate";
    ~^(application|text)/javascript    "public, max-age=3600, must-revalidate";

    # Картинки и шрифты для одного и того же имени практически
    # никогда не меняются.
    ~^image/                           "public, max-age=604800";
    ~^font/                            "public, max-age=604800";

    default                            "public, max-age=300, must-revalidate";
}

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    charset_types text/css application/javascript text/javascript application/json;

    # Версию nginx наружу не показываем.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    # ---------- Заголовки ----------
    #
    # Ключевая строка — connect-src 'none'. Страница не делает ни одного
    # сетевого вызова, и этот заголовок превращает утверждение в запрет,
    # который обеспечивает сам браузер: даже при внедрении постороннего
    # скрипта вынести введённый пароль наружу через fetch не получится.
    #
    # 'unsafe-inline' нет нигде: в разметке не осталось ни одного
    # inline-скрипта, стиля и обработчика в атрибуте.
    #
    # Внешними остаются только шрифты Google — стили с fonts.googleapis.com
    # и сами файлы с fonts.gstatic.com. Когда шрифты переедут в репозиторий,
    # обе записи уйдут и политика станет полностью 'self'.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; manifest-src 'self'" always;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;

    # TLS терминируется на Cloudflare, но заголовок с origin проходит
    # насквозь. Без includeSubDomains — политика касается только pwd.
    add_header Strict-Transport-Security "max-age=31536000" always;

    add_header Cache-Control $pwd_cache_control always;

    # ---------- Маршруты ----------

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
