name: apply-unified-navigation
on:
  push:
    branches: [feat/unify-primary-navigation]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/unify-primary-navigation}
      - name: Replace header navigation
        env:
          CURRENT_URL: https://pwd.1ms.my/
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('public/index.html'); text=p.read_text()
          start=text.index('<nav class="ribbon-nav'); body=text.index('>', start)+1; end=text.index('</nav>', body)+len('</nav>')
          opening=text[start:body]; old=text[start:end]; button=''
          if '<button' in old:
              bs=old.index('<button'); be=old.index('</button>', bs)+len('</button>'); button=old[bs:be]
          links=[('about me','https://aboutme.1ms.my/'),('link shortener','https://1ms.my/'),('Kubernetes platform architecture','https://infra.1ms.my/'),('Agentic AI architecture','https://agentic-ai.1ms.my/'),('AI SRE agent','https://ai-sre-agent.1ms.my/'),('secrets toolkit','https://pwd.1ms.my/'),('IP checker','https://myip.1ms.my/')]
          lines=[opening]+[f'            <a href="{u}"'+(' class="current"' if u==os.environ['CURRENT_URL'] else '')+f'>{l}</a>' for l,u in links]
          if button: lines.append(button)
          lines.append('          </nav>'); p.write_text(text[:start]+'\n'.join(lines)+text[end:])
          PY
          rm .github/workflows/apply-navigation.yml
          git config user.name 'GitHub Actions'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A; git commit -m 'feat: unify primary navigation'; git push origin HEAD:feat/unify-primary-navigation
